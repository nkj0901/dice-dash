<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다이스 대시</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 스킨을 화면 그리기 전에 먼저 적용 (깜빡임 방지). 자세한 건 main.js의 skin_* 참고
    (function () {
      var id = null;
      try { id = localStorage.getItem('dice-dash-skin'); } catch (e) {}
      if (id != 'classic' && id != 'xmas') {
        var m = new Date().getMonth();
        id = (m == 10 || m == 11) ? 'xmas' : 'classic';
      }
      document.documentElement.setAttribute('data-skin', id);
    })();
  </script>
</head>
<body>
  <!-- 1. 입장 화면 -->
  <section id="screen-entry" class="screen active">
    <div class="card entry">
      <h1 class="logo">🎲 <span class="logo-text">다이스 대시</span></h1>
      <p class="sub">2~8명이 방 코드로 모여 함께 달리는 주사위 레이스</p>
      <label class="field">
        <span>닉네임</span>
        <input id="nickname" maxlength="10" placeholder="최대 10자" autocomplete="off" onkeydown="if(event.keyCode==13){document.getElementById('room-code').focus();}">
      </label>
      <button id="btn-create" class="btn primary wide" onclick="btnCreate_Click()">방 만들기</button>
      <div class="divider"><span>또는</span></div>
      <div class="join-row">
        <input id="room-code" maxlength="4" placeholder="방 코드" autocomplete="off" onkeydown="if(event.keyCode==13) btnJoin_Click();">
        <button id="btn-join" class="btn" onclick="btnJoin_Click()">입장하기</button>
      </div>
      <label class="skin-row">
        <span>스킨</span>
        <select class="skin-select" onchange="skin_set(this.value)" aria-label="스킨 고르기"></select>
      </label>
    </div>
  </section>

  <!-- 2. 대기실 -->
  <section id="screen-lobby" class="screen">
    <div class="card lobby">
      <div class="lobby-head">
        <div>
          <div class="label">방 코드</div>
          <div class="code-row">
            <span id="lobby-code" class="room-code"></span>
            <button id="btn-copy" class="btn small" onclick="btnCopy_Click()">복사</button>
          </div>
          <div class="hint">다른 사람은 <b id="lobby-url"></b> 에 접속해 이 코드를 입력하세요.</div>
        </div>
        <div class="head-right">
          <select class="skin-select" onchange="skin_set(this.value)" aria-label="스킨 고르기"></select>
          <button id="btn-leave-lobby" class="btn ghost small" onclick="btnLeave_Click('lobby')">나가기</button>
        </div>
      </div>
      <div class="label"><span id="lobby-count"></span> / 8명</div>
      <ul id="lobby-members" class="member-list"></ul>
      <button id="btn-start" class="btn primary wide" onclick="net_send('game:start')">게임 시작</button>
      <p id="lobby-wait" class="hint center"></p>
    </div>
  </section>

  <!-- 3. 게임 화면 -->
  <section id="screen-game" class="screen">
    <header class="game-head">
      <div class="logo small">🎲 <span class="logo-text">다이스 대시</span></div>
      <div id="turn-indicator" class="turn-indicator"></div>
      <div class="head-right">
        <select class="skin-select" onchange="skin_set(this.value)" aria-label="스킨 고르기"></select>
        <span class="room-chip">방 <b id="game-code"></b></span>
        <button id="btn-leave-game" class="btn ghost small" onclick="btnLeave_Click('game')">나가기</button>
      </div>
    </header>
    <div id="arena" class="arena">
    <div id="board" class="board"></div>
    <div class="game-bottom">
      <div class="panel">
        <h3>플레이어</h3>
        <ul id="player-list" class="player-list"></ul>
      </div>
      <div class="panel controls">
        <div id="dice" class="dice"></div>
        <div id="banner" class="banner"></div>
        <div id="pending" class="pending"></div>
        <div class="items-label">내 아이템 <small>(굴리기 전에 사용, 턴당 1장)</small></div>
        <div id="my-items" class="my-items"></div>
        <div id="item-confirm" class="item-confirm"></div>
        <button id="btn-roll" class="btn primary wide big" onclick="btnRoll_Click()">🎲 주사위 굴리기</button>
      </div>
      <div class="panel">
        <h3>이벤트 로그</h3>
        <ol id="log" class="log"></ol>
      </div>
    </div>
    </div>

    <!-- 4. 결과 -->
    <!-- <div id="result_old" style="display:none"><table border="1" width="100%"><tr><td>순위</td><td>이름</td></tr></table></div> -->
    <div id="result" class="overlay hidden">
      <div class="card result">
        <h2>🏁 게임 종료</h2>
        <ol id="rankings" class="rankings"></ol>
        <div class="result-actions">
          <button id="btn-restart" class="btn primary" onclick="net_send('game:restart')">다시 하기</button>
          <button id="btn-leave-result" class="btn ghost" onclick="btnLeave_Click('result')">나가기</button>
        </div>
        <p id="result-wait" class="hint center"></p>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <!-- 순서 중요!!! 바꾸면 안됨 -->
  <script type="text/javascript" src="game_logic.js"></script>
  <script type="text/javascript" src="network.js"></script>
  <script type="text/javascript" src="main.js"></script>
  <!-- <script src="jquery-1.4.2.min.js"></script> -->
</body>
</html>
